[theme]
base = "light"
primaryColor = "#172033"
backgroundColor = "#FBFAF7"
secondaryBackgroundColor = "#F4F1EA"
textColor = "#172033"
borderColor = "#D8D2C5"
linkColor = "#0F766E"
codeBackgroundColor = "#F4F1EA"
codeTextColor = "#172033"
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 16
baseFontWeight = 400
headingFontSizes = ["36px", "28px", "22px", "18px", "16px", "14px"]
headingFontWeights = [700, 700, 600, 600, 600, 500]
baseRadius = "medium"
buttonRadius = "medium"
showWidgetBorder = true

blueColor = "#334155"
violetColor = "#57534E"
greenColor = "#0F766E"
orangeColor = "#A16207"
redColor = "#B42318"
grayColor = "#64748B"

[client]
showErrorDetails = "none"
toolbarMode = "minimal"

[server]
maxUploadSize = 10
