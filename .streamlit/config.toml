[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FB"
textColor = "#182033"
borderColor = "#D9E0EE"
linkColor = "#4338CA"
codeBackgroundColor = "#F5F7FB"
codeTextColor = "#182033"
font = "sans-serif"
headingFont = "sans-serif"
baseFontSize = 16
baseFontWeight = 400
headingFontSizes = ["36px", "28px", "22px", "18px", "16px", "14px"]
headingFontWeights = [700, 700, 600, 600, 600, 500]
baseRadius = "medium"
buttonRadius = "medium"
showWidgetBorder = true

blueColor = "#2563EB"
violetColor = "#4F46E5"
greenColor = "#15803D"
orangeColor = "#B45309"
redColor = "#C2413B"
grayColor = "#64748B"

[client]
showErrorDetails = "none"
toolbarMode = "minimal"

[server]
maxUploadSize = 10
